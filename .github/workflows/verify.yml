name: verify

on:
  push:
  pull_request:

jobs:
  lint:
    # Fast static checks that don't need a full chezmoi apply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y lua5.4
      # Pure-Lua parser behind WezTerm's LEADER+g "open in nvim" QuickSelect;
      # its self-test runs under plain Lua 5.4 (WezTerm's own Lua version).
      - name: filelinks self-test
        run: lua5.4 dot_config/wezterm/filelinks.lua
      # Syntax only (templated .lua.tmpl files are covered, rendered, by the
      # themes job). LuaJIT-only syntax would be flagged too, which is fine:
      # none of this config uses it.
      - name: Lua syntax
        run: git ls-files '*.lua' | xargs -n1 luac5.4 -p
      # shellcheck is preinstalled on ubuntu runners. Warning severity and up:
      # info-level notes (e.g. intentional single-quoted chezmoi templates)
      # aren't failures.
      - name: shellcheck
        run: shellcheck --severity=warning dot_local/bin/executable_theme-sync dot_local/bin/executable_theme-pick

  themes:
    # Every theme x every themed template: schema, render, parse, and the
    # palette lint (hue/contrast), strict. See scripts/check-themes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi and luac
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y lua5.4
      - name: check-themes
        run: |
          # An empty config: the checks must not depend on any machine's
          # chezmoi.toml, and with no .chezmoidata/zz-local.yaml in the
          # checkout this also exercises the default-theme fallback.
          touch "$RUNNER_TEMP/chezmoi.toml"
          CHEZMOI_CONFIG="$RUNNER_TEMP/chezmoi.toml" python3 scripts/check-themes --strict

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # PSScriptAnalyzer ships with the windows runner image. Errors only
      # (parse errors included); style rules like Write-Host aren't failures.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @("dot_local/bin/executable_theme-sync.ps1", "dot_local/bin/executable_theme-pick.ps1") |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  chezmoi-apply-dry-run:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
        if: runner.os != 'Windows'

      - name: Install chezmoi (Windows)
        run: |
          winget install twpayne.chezmoi --accept-source-agreements --accept-package-agreements
          # winget's user-scope shim dir isn't on PATH for later steps in
          # the same job unless added to GITHUB_PATH explicitly.
          echo "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH
        if: runner.os == 'Windows'

      - name: Dry-run apply into a scratch home
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          # --promptString's key must match the *prompt text* passed to
          # promptStringOnce in .chezmoi.toml.tmpl, not the data key — see
          # https://github.com/twpayne/chezmoi/issues/3345. Using the data
          # key here silently falls through to an interactive prompt, which
          # fails with "could not open a new TTY" on a CI runner.
          #
          # --config must point inside --destination too: chezmoi's verbose
          # diff output (-v) panics ("X: not in Y") if the config directory
          # (which defaults to $HOME/.config/chezmoi, outside the scratch
          # destination) isn't nested under the destination it's diffing.
          "$HOME/.local/bin/chezmoi" init --apply --source="$GITHUB_WORKSPACE" \
            --destination="$RUNNER_TEMP/home" \
            --config="$RUNNER_TEMP/home/.config/chezmoi/chezmoi.toml" \
            --promptString "Full name for git config=Test,Email for git config=test@example.com" \
            --dry-run -v
        if: runner.os != 'Windows'

      - name: Dry-run apply into a scratch home (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\home" | Out-Null
          # See the bash step above for why the key must be the prompt text
          # and why --config must be nested under --destination.
          chezmoi init --apply --source="$env:GITHUB_WORKSPACE" `
            --destination="$env:RUNNER_TEMP\home" `
            --config="$env:RUNNER_TEMP\home\.config\chezmoi\chezmoi.toml" `
            --promptString "Full name for git config=Test,Email for git config=test@example.com" `
            --dry-run -v
        if: runner.os == 'Windows'
