# Single source of truth for color themes.
# `current_theme` picks which entry under `themes` is live. Switch it either
# by hand (edit this file, then `chezmoi apply`) or via the theme picker
# (<leader>ft in Neovim, or the `theme-pick` command in a shell) which does
# the same edit plus a live re-render, no full `chezmoi apply` required.
# Shape: base24 (base16 slots 00-0F plus extended ANSI-bright slots 10-17).
#
# Adding a theme: base00-0F should come from the scheme's own published
# base16 definition. For base10-17 (bright ANSI, a base24 extension with no
# base16 upstream equivalent), use the scheme's own published "bright"
# terminal colors when it has them; otherwise fall back to aliasing
# base10->base03, base11->base07, base12->base08, base13->base0A,
# base14->base0B, base15->base0C, base16->base0D, base17->base0E.
current_theme: "flexoki-moon"
themes:
  flexoki-moon:
    name: "Flexoki Moon"
    palette:
      base00: "100f0f" # bg
      base01: "1c1b1a" # bg alt
      base02: "343331" # selection bg
      base03: "575653" # comment / muted fg
      base04: "878580" # dim fg
      base05: "cecdc3" # fg
      base06: "e6e4d9" # bright fg
      base07: "fffcf0" # brightest fg
      base08: "af3029" # red
      base09: "bc5215" # orange
      base0A: "ad8301" # yellow
      base0B: "66800b" # green
      base0C: "24837b" # cyan
      base0D: "205ea6" # blue
      base0E: "a02f6f" # magenta
      base0F: "205ea6" # brown slot (aliased to blue)
      base10: "575653" # ansi bright black
      base11: "fffcf0" # ansi bright white/grey
      base12: "d14d41" # ansi bright red
      base13: "d0a215" # ansi bright yellow
      base14: "879a39" # ansi bright green
      base15: "3aa99f" # ansi bright cyan
      base16: "4385be" # ansi bright blue
      base17: "ce5d97" # ansi bright magenta
  flexoki-light:
    name: "Flexoki Light"
    palette:
      # Same accent hues as Flexoki Moon (Flexoki's "600"/"400" weight
      # accents are designed to read on both light and dark paper), with the
      # grayscale ramp mirrored: base00 is the paper background instead of
      # black, base07 is black instead of paper.
      base00: "fffcf0" # bg (paper)
      base01: "e6e4d9" # bg alt
      base02: "cecdc3" # selection bg
      base03: "878580" # comment / muted fg
      base04: "575653" # dim fg
      base05: "343331" # fg
      base06: "1c1b1a" # bright fg
      base07: "100f0f" # brightest fg (black)
      base08: "af3029" # red
      base09: "bc5215" # orange
      base0A: "ad8301" # yellow
      base0B: "66800b" # green
      base0C: "24837b" # cyan
      base0D: "205ea6" # blue
      base0E: "a02f6f" # magenta
      base0F: "205ea6" # brown slot (aliased to blue)
      base10: "878580" # ansi bright black
      base11: "100f0f" # ansi bright white/grey
      base12: "d14d41" # ansi bright red
      base13: "d0a215" # ansi bright yellow
      base14: "879a39" # ansi bright green
      base15: "3aa99f" # ansi bright cyan
      base16: "4385be" # ansi bright blue
      base17: "ce5d97" # ansi bright magenta
  gruvbox-dark:
    name: "Gruvbox Dark"
    palette:
      # From tinted-theming/base16-gruvbox-scheme's "dark-medium" variant.
      # No separate upstream bright-ANSI set exists, so base10-17 fall back
      # to aliasing the matching base0X slot per the rule above.
      base00: "282828" # bg
      base01: "3c3836" # bg alt
      base02: "504945" # selection bg
      base03: "665c54" # comment / muted fg
      base04: "bdae93" # dim fg
      base05: "d5c4a1" # fg
      base06: "ebdbb2" # bright fg
      base07: "fbf1c7" # brightest fg
      base08: "fb4934" # red
      base09: "fe8019" # orange
      base0A: "fabd2f" # yellow
      base0B: "b8bb26" # green
      base0C: "8ec07c" # cyan/aqua
      base0D: "83a598" # blue
      base0E: "d3869b" # magenta/purple
      base0F: "d65d0e" # brown
      base10: "665c54" # ansi bright black (= base03)
      base11: "fbf1c7" # ansi bright white/grey (= base07)
      base12: "fb4934" # ansi bright red (= base08)
